<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureShield - {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stat-card { text-align: center; padding: 1.5rem; }
        .stat-number { font-size: 2.5rem; font-weight: bold; }
        .blocked { color: #dc3545; }
        .allowed { color: #198754; }
        .nav-link.active { font-weight: bold; }
        .badge-sqli { background-color: #dc3545; }
        .badge-xss { background-color: #fd7e14; }
        .badge-bruteforce { background-color: #6f42c1; }
        .badge-ml { background-color: #0d6efd; }
        .badge-none { background-color: #6c757d; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/dashboard/">SecureShield</a>
            <div class="navbar-nav">
                <a class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}" href="/dashboard/">Stats</a>
                <a class="nav-link {% if '/logs' in request.path %}active{% endif %}" href="/dashboard/logs">Logs</a>
                <a class="nav-link {% if '/blocklist' in request.path %}active{% endif %}" href="/dashboard/blocklist">Blocklist</a>
                <a class="nav-link" href="/dashboard/report">Download Report</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="container mt-5 mb-3 text-muted text-center">
        <small>SecureShield WAF — Bachelor of Cyber Security Project — Maria Akter</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
